<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Date</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Switzer', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    overflow-y: hidden;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px 4px;
    font-size: 14px;
    font-weight: 600;
    color: #000;
  }

  .status-bar .time {
    font-size: 14px;
    font-weight: 600;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-icons svg {
    width: 16px;
    height: 16px;
    fill: #000;
  }

  /* Header */
  .header {
    padding: 12px 16px 0;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: none;
    border: none;
  }

  .back-btn svg {
    width: 24px;
    height: 24px;
    fill: #000;
  }

  /* Page Content */
  .page-content {
    padding: 20px 24px 0;
    text-align: center;
  }

  .page-title {
    font-size: 24px;
    font-weight: 800;
    color: #000;
    letter-spacing: 1px;
    margin-bottom: 16px;
    font-family: 'Switzer', 'Inter', sans-serif;
  }

  .page-subtitle {
    font-size: 14px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 32px;
    font-family: 'Switzer', 'Inter', sans-serif;
  }

  /* Date Fields */
  .date-fields {
    padding: 0 24px;
    text-align: left;
  }

  .date-field {
    margin-bottom: 24px;
  }

  .date-field-label {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-family: 'Switzer', 'Inter', sans-serif;
  }

  .date-field-input {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid #ddd;
  }

  .date-field-value {
    font-size: 18px;
    font-weight: 700;
    color: #000;
    font-family: 'Switzer', 'Inter', sans-serif;
  }

  .date-field-icon svg {
    width: 24px;
    height: 24px;
    fill: #2ec56d;
  }

  /* Overlay */
  .overlay {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 390px;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 10;
  }

  /* Bottom Sheet */
  .bottom-sheet {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 390px;
    background: #fff;
    border-radius: 20px 20px 0 0;
    z-index: 20;
    padding: 0 0 30px;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 12px auto 20px;
  }

  .sheet-title {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #000;
    letter-spacing: 1px;
    margin-bottom: 24px;
    font-family: 'Switzer', 'Inter', sans-serif;
  }

  /* Date Picker */
  .date-picker {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
    position: relative;
  }

  .date-picker::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 10%;
    right: 10%;
    height: 44px;
    transform: translateY(-50%);
    border-top: 1px solid #e0e0e0;
    border-bottom: 1px solid #e0e0e0;
    pointer-events: none;
    z-index: 1;
  }

  .picker-column {
    flex: 1;
    max-width: 100px;
    height: 140px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .picker-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #ccc;
    font-family: 'Switzer', 'Inter', sans-serif;
    transition: all 0.2s;
  }

  .picker-item.selected {
    font-size: 18px;
    font-weight: 700;
    color: #000;
  }

  .picker-item.faded {
    color: #ddd;
    font-size: 15px;
  }

  /* Select Button */
  .select-btn {
    display: block;
    width: calc(100% - 40px);
    margin: 0 20px;
    padding: 18px;
    background: linear-gradient(135deg, #2ec56d, #27ae60);
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: 'Switzer', 'Inter', sans-serif;
    box-shadow: 0 4px 15px rgba(46, 197, 109, 0.3);
  }

  .select-btn:hover {
    background: linear-gradient(135deg, #27ae60, #219a52);
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar">
  <span class="time">9:00</span>
  <div class="status-icons">
    <svg viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88-1.88z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    <svg viewBox="0 0 24 24"><rect x="17" y="4" width="5" height="16" rx="1" fill="none" stroke="#000" stroke-width="1.5"/><rect x="18" y="8" width="3" height="10" rx="0.5"/></svg>
  </div>
</div>

<!-- Header -->
<div class="header">
  <button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
</div>

<!-- Page Content -->
<div class="page-content">
  <div class="page-title">SELECT DATE</div>
  <div class="page-subtitle">Choose a date range you want to<br>filter draw codes</div>
</div>

<!-- Date Fields -->
<div class="date-fields">
  <div class="date-field">
    <div class="date-field-label">START DATE</div>
    <div class="date-field-input">
      <span class="date-field-value">03/02/2026</span>
      <span class="date-field-icon">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
      </span>
    </div>
  </div>
  <div class="date-field">
    <div class="date-field-label">END DATE</div>
    <div class="date-field-input">
      <span class="date-field-value">03/02/2026</span>
      <span class="date-field-icon">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
      </span>
    </div>
  </div>
</div>

<!-- Overlay -->
<div class="overlay"></div>

<!-- Bottom Sheet -->
<div class="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">START DATE</div>

  <div class="date-picker">
    <!-- Day Column -->
    <div class="picker-column">
      <div class="picker-item faded">08</div>
      <div class="picker-item selected">09</div>
      <div class="picker-item faded">10</div>
    </div>
    <!-- Month Column -->
    <div class="picker-column">
      <div class="picker-item faded">SEP</div>
      <div class="picker-item selected">OCT</div>
      <div class="picker-item faded">NOV</div>
    </div>
    <!-- Year Column -->
    <div class="picker-column">
      <div class="picker-item faded">2021</div>
      <div class="picker-item selected">2022</div>
      <div class="picker-item faded">2023</div>
    </div>
  </div>

  <button class="select-btn" onclick="window.location.href='5.html'">SELECT</button>
</div>

</body>
</html>
