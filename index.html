<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Lite — All Pages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-300.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
  @font-face{font-family:'Switzer';src:url('assets/fonts/switzer-900.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}
  body{
    font-family:'Switzer','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f3f4f6;
    color:#16181d;
    display:flex;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:264px;
    flex-shrink:0;
    height:100%;
    background:#fff;
    border-right:1px solid #ececf0;
    display:flex;
    flex-direction:column;
  }
  .sb-head{
    display:flex;
    align-items:center;
    gap:11px;
    padding:18px 16px;
    border-bottom:1px solid #f0f0f3;
    flex-shrink:0;
  }
  .sb-logo{
    width:38px;height:38px;flex-shrink:0;
    border-radius:10px;
    background:linear-gradient(135deg,#ef4238,#d3211f);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;
  }
  .sb-name{font-size:14px;font-weight:800;letter-spacing:-.1px}
  .sb-sub{margin-top:2px;font-size:11px;color:#8a9099;font-weight:500}

  .sb-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:8px 0 28px;
  }

  .group-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:13px 16px;
    background:none;
    border:none;
    font-family:inherit;
    font-size:11px;
    font-weight:800;
    letter-spacing:.7px;
    color:#8a9099;
    text-transform:uppercase;
    cursor:pointer;
    border-top:1px solid #f4f4f6;
  }
  .group:first-child .group-btn{border-top:none}
  .group-btn:hover{color:#16181d;background:#fafafb}
  .group-btn .chev{
    width:14px;height:14px;flex-shrink:0;
    fill:none;stroke:#b6bbc2;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;
    transition:transform .18s ease;
  }
  .group.open .group-btn{color:#16181d}
  .group.open .group-btn .chev{transform:rotate(90deg)}

  .group-items{display:none;padding:0 8px 8px}
  .group.open .group-items{display:block}

  .page-link{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 10px;
    border-radius:9px;
    text-decoration:none;
    color:#16181d;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .page-link:hover{background:#f5f6f8}
  .page-link svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:#6b7079;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .page-link.active{background:#fdeeee;color:#e8343e}
  .page-link.active svg{stroke:#e8343e}
  .page-link .file{
    margin-left:auto;
    font-size:10px;
    font-weight:600;
    color:#b6bbc2;
  }
  .page-link.active .file{color:#eb8b8b}

  /* ---------- Preview ---------- */
  .stage{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    background:linear-gradient(45deg,#1c9b52 0%,#c41e2a 58%,#e8343e 100%);
  }
  /* current screen + product controls live in the sidebar footer */
  .sb-foot{
    flex-shrink:0;
    border-top:1px solid #f0f0f3;
    padding:14px 16px 16px;
    background:#fff;
  }

  .sb-controls{margin:0}
  .sb-controls select{
    width:100%;
    font-family:inherit;
    font-size:12px;font-weight:700;
    color:#16181d;
    background:#f5f6f8;
    border:1px solid #e7e9ed;
    border-radius:9px;
    padding:9px 10px;
    margin-bottom:9px;
    cursor:pointer;
  }
  .sb-controls select:last-child{margin-bottom:0}

  .stage-body{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .phone{
    width:390px;
    height:844px;
    max-height:100%;
    background:#fff;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    overflow:hidden;
    flex-shrink:0;
  }
  .phone iframe{width:100%;height:100%;border:none;display:block}

  .empty{
    color:rgba(255,255,255,.9);
    font-size:13px;
    font-weight:600;
  }
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-logo">M</div>
    <div>
      <div class="sb-name">Merchant Lite App</div>
      <div class="sb-sub">All Pages &bull; <span id="screenCount">0</span> Screens</div>
    </div>
  </div>

  <div class="sb-scroll" id="sbScroll"></div>

  <div class="sb-foot">
    <div class="sb-controls" id="qaControls" hidden>
      <select id="qaProduct" aria-label="Product"></select>
      <select id="qaVariant" aria-label="Variant"></select>
    </div>

  </div>
</aside>

<!-- ===== Preview ===== -->
<main class="stage">
  <div class="stage-body">
    <div class="phone"><iframe id="preview" src="home.html" title="Screen preview"></iframe></div>
  </div>
</main>

<script>
(function () {
  /* Add a screen by dropping it into the right group - the sidebar,
     the screen count and the preview all pick it up automatically. */
  var ICONS = {
    home:  '<svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
    star:  '<svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.8l5.8-.9z"/></svg>',
    gift:  '<svg viewBox="0 0 24 24"><path d="M3.5 11h17v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M2.5 7.5h19V11h-19zM12 7.5v14"/><path d="M12 7.5S10.5 3 8 3a2.3 2.3 0 0 0 0 4.5zM12 7.5S13.5 3 16 3a2.3 2.3 0 0 1 0 4.5z"/></svg>',
    swap:  '<svg viewBox="0 0 24 24"><path d="M4 8.5h14l-3.5-3.5M20 15.5H6l3.5 3.5"/></svg>',
    list:  '<svg viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>',
    info:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5M12 8.2h.01"/></svg>',
    check: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="m8.4 12.3 2.5 2.5 4.7-4.9"/></svg>',
    truck: '<svg viewBox="0 0 24 24"><path d="M3 7h10v9H3zM13 10.5h4l3 3V16h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>',
    pin:   '<svg viewBox="0 0 24 24"><path d="M12 21s6.5-5.4 6.5-10A6.5 6.5 0 1 0 5.5 11c0 4.6 6.5 10 6.5 10z"/><circle cx="12" cy="10.8" r="2.3"/></svg>',
    cart:  '<svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 11h9.8l2.2-8H6.2"/><circle cx="9.5" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>',
    ticket:'<svg viewBox="0 0 24 24"><path d="M4 8.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 7v10"/></svg>',
    cal:   '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8.5 3.5V6M15.5 3.5V6"/></svg>',
    promo: '<svg viewBox="0 0 24 24"><path d="M4 10.5 12.5 3l7.5 2 1 7.5L13 21z"/><circle cx="15.5" cy="8" r="1.4"/></svg>',
    grid:  '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>'
  };

  var GROUPS = [
    { name: 'Home', open: true, items: [
      { label: 'Merchant Home', file: 'home.html', icon: 'home' }
    ]},
    { name: 'Loyalty Points', open: false, items: [
      { label: 'Loyalty Point',        file: '8.html',    icon: 'star' },
      { label: 'Convert Float',        file: '12.html',   icon: 'swap' },
      { label: 'How It Works',         file: '14.html',   icon: 'info' },
      { label: 'Activity History',     file: '20.html',   icon: 'list' },
      { label: 'Check Rewards',        file: '9.html',    icon: 'gift' },
      { label: 'Reward Details',       file: '16.html',   icon: 'gift' },
      { label: 'Reward Details (Alt)', file: '16_1.html', icon: 'gift' },
      { label: 'Confirm Order',        file: '17.html',   icon: 'cart' },
      { label: 'Track Delivery',       file: '18.html',   icon: 'truck' },
      { label: 'Delivery Details',     file: '19.html',   icon: 'pin' }
    ]},
    { name: 'Merchant Promo', open: false, items: [
      { label: 'Promo Home',     file: '2.html', icon: 'promo' },
      { label: 'Promo Rules',    file: '6.html', icon: 'info' },
      { label: 'Draw Codes',     file: '3.html', icon: 'ticket' },
      { label: 'Select Date',    file: '4.html', icon: 'cal' },
      { label: 'Download Codes', file: '5.html', icon: 'cal' },
      { label: 'Prize Matrix',   file: '7.html', icon: 'grid' }
    ]}
  ];

  var scroll  = document.getElementById('sbScroll');
  var preview = document.getElementById('preview');
  var count   = 0;

  function buildItems(items, container) {
    items.forEach(function (it) {
      count++;
      var a = document.createElement('a');
      a.className = 'page-link';
      a.href = it.file;
      a.innerHTML = (ICONS[it.icon] || ICONS.grid) +
        '<span>' + it.label + '</span>' +
        '<span class="file">' + it.file.replace('.html', '') + '</span>';
      a.addEventListener('click', function (e) {
        e.preventDefault();
        select(a, it);
      });
      container.appendChild(a);
    });
  }

  GROUPS.forEach(function (g) {
    var wrap = document.createElement('div');
    wrap.className = 'group' + (g.open ? ' open' : '');

    var btn = document.createElement('button');
    btn.className = 'group-btn';
    btn.type = 'button';
    btn.innerHTML = '<span>' + g.name + '</span>' +
      '<svg class="chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>';
    btn.addEventListener('click', function () { wrap.classList.toggle('open'); });
    wrap.appendChild(btn);

    var list = document.createElement('div');
    list.className = 'group-items';
    buildItems(g.items, list);

    wrap.appendChild(list);
    scroll.appendChild(wrap);
  });

  document.getElementById('screenCount').textContent = count;

  function select(link, item) {
    var prev = scroll.querySelector('.page-link.active');
    if (prev) prev.classList.remove('active');
    link.classList.add('active');
    if (item.file.indexOf('home.html') === -1) qaControls.hidden = true;
    preview.src = item.file;
  }

  /* ----- Quick-actions dropdowns (the embedded page sends its catalog) ----- */
  var qaControls = document.getElementById('qaControls');
  var qaProduct  = document.getElementById('qaProduct');
  var qaVariant  = document.getElementById('qaVariant');
  var qaCatalog  = null;

  function fillSelect(sel, values, index) {
    sel.innerHTML = '';
    values.forEach(function (name, i) {
      var o = document.createElement('option');
      o.value = i;
      o.textContent = name;
      sel.appendChild(o);
    });
    sel.value = index;
  }

  function sendSelection() {
    preview.contentWindow.postMessage({
      type: 'qa-select',
      p: +qaProduct.value,
      v: +qaVariant.value
    }, '*');
  }

  qaProduct.addEventListener('change', function () {
    var p = qaCatalog[+qaProduct.value];
    fillSelect(qaVariant, p.variants, 0);
    qaVariant.hidden = p.variants.length < 2;
    sendSelection();
  });
  qaVariant.addEventListener('change', sendSelection);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'qa-catalog') return;
    qaCatalog = d.products;
    fillSelect(qaProduct, qaCatalog.map(function (p) { return p.name; }), d.p);
    fillSelect(qaVariant, qaCatalog[d.p].variants, d.v);
    qaVariant.hidden = qaCatalog[d.p].variants.length < 2;
    qaControls.hidden = false;
  });

  /* Open on the first screen of the first group. */
  var first = scroll.querySelector('.page-link');
  if (first) select(first, GROUPS[0].items[0]);
})();
</script>

</body>
</html>
